<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equities Performance</title>
  <style>
    :root {
      --bg:       #0e1b0e;
      --surface:  #162616;
      --surface2: #1d321d;
      --text:     #90ee90;
      --muted:    #558055;
      --border:   #2c472c;
      --accent:   #b8ffb8;
      --up:       #4ade80;
      --down:     #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: system-ui, sans-serif;
      color: var(--text);
      padding: 48px 24px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 40px;
    }

    .table-frame {
      position: relative;
      max-width: 700px;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 0 24px rgba(144, 238, 144, 0.07);
    }

    .table-inner {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: rgba(144, 238, 144, 0.06);
    }

    th {
      padding: 14px 16px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th:first-child { text-align: left; padding-left: 24px; }
    th:last-child  { padding-right: 24px; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.2s;
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover { background: var(--surface2); }

    td {
      padding: 16px 16px;
      font-size: 0.85rem;
      vertical-align: middle;
      text-align: right;
      color: var(--text);
    }

    td:first-child { text-align: left; padding-left: 24px; }
    td:last-child  { padding-right: 24px; }

    .symbol {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .name {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .up   { color: var(--up); }
    .down { color: var(--down); }

    .gain {
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>Equities</h1>

  <div class="table-frame">
    <div class="table-inner">
      <table>
        <thead>
          <tr>
            <th>Symbol / Name</th>
            <th>Price</th>
            <th>Price Change</th>
            <th>Gain / Loss</th>
          </tr>
        </thead>
        <tbody>

          <tr>
            <td>
              <span class="symbol">KRKNF</span>
              <span class="name">Kraken Robotics Inc</span>
            </td>
            <td>$6.0865</td>
            <td class="up">+$0.0065</td>
            <td class="gain up">+36.05%</td>
          </tr>

          <tr>
            <td>
              <span class="symbol">KYTX</span>
              <span class="name">Kyverna Therapeutics</span>
            </td>
            <td>$9.16</td>
            <td class="down">-$0.06</td>
            <td class="gain up">+24.12%</td>
          </tr>

          <tr>
            <td>
              <span class="symbol">NTLA</span>
              <span class="name">Intellia Therapeutics</span>
            </td>
            <td>$13.7746</td>
            <td class="down">-$0.0954</td>
            <td class="gain up">+15.75%</td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
